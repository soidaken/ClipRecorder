[package]
name = "cliprecorder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ClipRecorder"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_Media_MediaFoundation",
] }
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
